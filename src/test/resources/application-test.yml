meterpay:
  payment:
    paystack:
      # Not a real key. Tests never reach Paystack: the gateway is pointed at WireMock where it is exercised.
      secret-key: sk_test_not_a_real_key
  security:
    jwt:
      # Test-only value. Real environments get theirs from JWT_SECRET.
      secret: test-only-jwt-secret-0123456789-abcdefghijklmnop
    # Strength 4 instead of 12 keeps hashing fast in tests; production strength comes from application.yml.
    bcrypt-strength: 4
