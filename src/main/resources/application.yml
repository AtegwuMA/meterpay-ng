spring:
  application:
    name: meterpay
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:meterpay}
    username: ${POSTGRES_USER:meterpay}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # The outbox relay waits for every in-sync replica, and gives up on a missing broker quickly instead of
      # blocking a poll (and its row locks) for Kafka's default minute.
      acks: all
      properties:
        max.block.ms: 10000

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

meterpay:
  security:
    jwt:
      # No default on purpose: without JWT_SECRET the app refuses to start (see JwtProperties).
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m
      issuer: meterpay
    bcrypt-strength: 12
  identity:
    # DESIGN 11: refresh tokens live 30 days and are rotated on every use.
    refresh-token-ttl: 30d
    # DESIGN 17.3: all three or none. Creates the first admin at startup if there is none yet.
    bootstrap-admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      phone: ${BOOTSTRAP_ADMIN_PHONE:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  payment:
    paystack:
      base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
      # No default on purpose: without PAYSTACK_SECRET_KEY the app refuses to start (see PaystackProperties).
      secret-key: ${PAYSTACK_SECRET_KEY:}
      callback-url: ${PAYSTACK_CALLBACK_URL:}
      # Short, so a slow provider cannot hold a request thread and a database connection for long.
      connect-timeout: 3s
      read-timeout: 10s
    # DESIGN 8.1: every 5 minutes, verify unsettled top-ups older than 10 minutes; fail pending ones unpaid at 60.
    reconciliation:
      interval: PT5M
      stale-after: PT10M
      expire-after: PT60M
      batch-size: 100
  ledger:
    # How often the whole ledger is checked to balance (DESIGN 6.3). ISO-8601, as @Scheduled reads it.
    imbalance-check-interval: PT5M
  outbox:
    # DESIGN 8.4: committed events reach Kafka within about a second.
    poll-interval: PT1S
    batch-size: 100
    send-timeout: 10s
    topic-partitions: 3
  tariff:
    # Copied onto each new tariff version, so changing this never reprices an existing one (DESIGN 6.2).
    platform-fee-basis-points: ${TARIFF_PLATFORM_FEE_BASIS_POINTS:200}

logging:
  pattern:
    # Slots into Spring Boot's default Logback pattern, so every line carries the request's ID.
    correlation: "[%X{correlationId:-}] "
