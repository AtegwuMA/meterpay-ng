spring:
  application:
    name: meterpay
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:meterpay}
    username: ${POSTGRES_USER:meterpay}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

meterpay:
  security:
    jwt:
      # No default on purpose: without JWT_SECRET the app refuses to start (see JwtProperties).
      secret: ${JWT_SECRET:}
      access-token-ttl: 15m
      issuer: meterpay
    bcrypt-strength: 12
  identity:
    # DESIGN 11: refresh tokens live 30 days and are rotated on every use.
    refresh-token-ttl: 30d

logging:
  pattern:
    # Slots into Spring Boot's default Logback pattern, so every line carries the request's ID.
    correlation: "[%X{correlationId:-}] "
